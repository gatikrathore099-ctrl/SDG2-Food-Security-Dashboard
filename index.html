/* =========================================================
   UTILITIES
   ========================================================= */
function normalizeCountryName(s) {
  if (!s) return '';
  s = s.trim().toLowerCase();
  if (s === 'usa' || s === 'united states' || s === 'united states of america' || s === 'u.s.' || s === 'us') return 'United States';
  return s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function normalizeText(s) { return s ? s.trim().toLowerCase() : ''; }
function findCountry(name) {
  if (!name) return null;
  const norm = normalizeCountryName(name).toLowerCase();
  return COUNTRIES.find(c => c.name.toLowerCase() === norm);
}
function getUniqueStates() {
  const states = new Set();
  CROPS.forEach(crop => {
    if (crop.states) crop.states.split(',').forEach(s => { const t = s.trim(); if (t) states.add(t); });
  });
  return Array.from(states).sort();
}
function filterCrops(filters) {
  return CROPS.filter(c => {
    if (filters.state && !(c.states && c.states.toLowerCase().includes(filters.state.toLowerCase()))) return false;
    if (filters.season && !(c.season && c.season.toLowerCase().includes(filters.season.toLowerCase()))) return false;
    if (filters.type && c.type !== filters.type) return false;
    if (filters.water) {
      if (!c.water) return false;
      const m = c.water.match(/(\d+)\s*[-–]\s*(\d+)/) || c.water.match(/(\d+)/);
      if (m) {
        const low = parseInt(m[1]); const high = m[2] ? parseInt(m[2]) : low;
        if (filters.water === 'low' && high >= 600) return false;
        if (filters.water === 'medium' && (high < 600 || low > 900)) return false;
        if (filters.water === 'high' && high < 900) return false;
      } else return false;
    }
    return true;
  });
}
function parseNumericValue(value) {
  if (!value) return null;
  if (value.toLowerCase().includes('not ranked')) return null;
  if (value.toLowerCase().includes('low')) return null;
  const rangeMatch = value.match(/([\d.,]+)\s*[–-]\s*([\d.,]+)/);
  if (rangeMatch) {
    const low = parseFloat(rangeMatch[1].replace(/,/g, ''));
    const high = parseFloat(rangeMatch[2].replace(/,/g, ''));
    return { type: 'range', low, high, avg: (low + high) / 2 };
  }
  const ltMatch = value.match(/<\s*([\d.,]+)/);
  if (ltMatch) return { type: 'less-than', value: parseFloat(ltMatch[1].replace(/,/g, '')) };
  const numMatch = value.match(/([\d.,]+)/);
  if (numMatch) return { type: 'exact', value: parseFloat(numMatch[1].replace(/,/g, '')) };
  return null;
}
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

   ========================================================= */
const barDataLabelsPlugin = {
  id: 'barDataLabels',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    const meta = chart.getDatasetMeta(0);
    if (!meta || !meta.data || !meta.data.length) return;
    const dataPoints = chart.$dataPoints;
    if (!dataPoints || !dataPoints.length) return;
    const isDark = chart.$isDark || false;
    const labelColor = isDark ? '#E8F0E4' : '#1A2E1A';

    ctx.save();
    ctx.font = '600 10px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = labelColor;

    meta.data.forEach((bar, i) => {
      const dp = dataPoints[i];
      if (!dp || !dp.original || dp.y == null) return;
      let value = dp.original;
      if (value.length > 22) value = value.substring(0, 20) + '…';
      ctx.fillText(value, bar.x, bar.y - 6);
    });
    ctx.restore();
  }
};
Chart.register(barDataLabelsPlugin);

/* =========================================================
   CHART OPTIONS BUILDER
   ========================================================= */
function buildChartOptions(isDark, dataPoints) {
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
  const textColor = isDark ? '#B8C8B8' : '#3C4B3C';

  let yMax = null;
  dataPoints.forEach(d => {
    if (d.y == null) return;
    yMax = Math.max(yMax || 0, d.y);
  });
  const paddedMax = yMax ? yMax * 1.30 : undefined;

  return {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 600, easing: 'easeOutQuart' },
    layout: { padding: { top: 40, right: 16, bottom: 4, left: 8 } },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: isDark ? '#162017' : '#FFFFFF',
        borderColor: isDark ? '#2A3A2C' : '#E5E8E3',
        borderWidth: 1,
        titleColor: isDark ? '#E8F0E4' : '#1A2E1A',
        bodyColor: isDark ? '#94A894' : '#5C6B5C',
        displayColors: false,
        padding: 12,
        cornerRadius: 8,
        callbacks: {
          label: function(ctx) {
            const dp = dataPoints[ctx.dataIndex];
            return dp.original || 'Data not available in current dataset';
          }
        }
      }
    },
    scales: {
      x: {
        grid: { display: false },
        ticks: {
          color: textColor,
          font: { size: 11, family: 'Inter', weight: '500' },
          maxRotation: 0,
          autoSkip: false
        }
      },
      y: {
        grid: { color: gridColor, drawBorder: false },
        ticks: {
          color: textColor,
          font: { size: 10, family: 'Inter' },
          padding: 6,
          maxTicksLimit: 6,
          callback: function(value) {
            if (value >= 1000) return (value / 1000).toFixed(1) + 'k';
            return value;
          }
        },
        beginAtZero: true,
        grace: '15%',
        suggestedMax: paddedMax
      }
    }
  };
}

/* =========================================================
   CHART DATA POINTS BUILDER  (uses AVERAGE for ranges → solid bars)
   ========================================================= */
function buildDataPoints(countries, field) {
  return countries.map(c => {
    const parsed = parseNumericValue(c[field]);
    if (!parsed) return { y: null, original: c[field], label: c.name, flag: c.flag };
    let barValue;
    if (parsed.type === 'range') barValue = parsed.avg;
    else if (parsed.type === 'less-than') barValue = parsed.value;
    else barValue = parsed.value;
    return { y: barValue, original: c[field], label: c.name, flag: c.flag };
  });
}

function makeBarChart(canvasId, countries, field, isDark, palette) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  const ctx = canvas.getContext('2d');
  const dataPoints = buildDataPoints(countries, field);

  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: dataPoints.map(d => `${d.flag} ${d.label}`),
      datasets: [{
        data: dataPoints.map(d => d.y),
        backgroundColor: countries.map((_, i) => palette[i % palette.length] + (isDark ? 'dd' : 'cc')),
        borderColor: countries.map((_, i) => palette[i % palette.length]),
        borderWidth: 1.5,
        borderRadius: 6,
        maxBarThickness: 64
      }]
    },
    options: buildChartOptions(isDark, dataPoints)
  });
  chart.$dataPoints = dataPoints;
  chart.$isDark = isDark;
  return chart;
}

/* =========================================================
   HUNGER RISK INDICATOR  (Low / Medium / High)
   ========================================================= */
const RISK_PRESETS = {
  "India":         { inflation: 6.5, drought: 5, conflict: 2, undernourishment: 12.0 },
  "China":         { inflation: 0.5, drought: 3, conflict: 1, undernourishment: 2.5 },
  "United States": { inflation: 2.5, drought: 4, conflict: 1, undernourishment: 2.5 },
  "Nigeria":       { inflation: 28,  drought: 7, conflict: 4, undernourishment: 19.9 },
  "Bangladesh":    { inflation: 12.92, drought: 3, conflict: 2, undernourishment: 11.9 }
};

/*
 * Independent Hunger Risk Score (0–100)
 * Maximum contribution:
 *   Food inflation       25 points
 *   Drought severity     20 points
 *   Conflict intensity   15 points
 *   Undernourishment     40 points
 *
 * Normalization:
 *   Inflation:          MIN(inflation / 20, 1) × 25
 *   Drought:            ((drought - 1) / 9) × 20
 *   Conflict:           ((conflict - 1) / 4) × 15
 *   Undernourishment:  MIN(undernourishment / 20, 1) × 40
 */
const RISK_LEVELS = {
  low:      { label: 'LOW HUNGER RISK',       emoji: '🟢', bar: 'var(--primary)', glow: 'var(--primary-glow)',              text: 'var(--primary)' },
  moderate: { label: 'MODERATE HUNGER RISK',  emoji: '🟡', bar: 'var(--accent)',  glow: 'rgba(232, 165, 58, 0.15)',         text: 'var(--accent)' },
  high:     { label: 'HIGH HUNGER RISK',      emoji: '🟠', bar: 'var(--accent)',  glow: 'rgba(232, 165, 58, 0.22)',         text: 'var(--accent)' },
  veryHigh: { label: 'VERY HIGH HUNGER RISK', emoji: '🔴', bar: 'var(--warning)', glow: 'rgba(216, 90, 58, 0.15)',         text: 'var(--warning)' },
  extreme:  { label: 'EXTREME HUNGER RISK',   emoji: '🔴', bar: 'var(--warning)', glow: 'rgba(216, 90, 58, 0.25)',         text: 'var(--warning)' }
};

const riskLabelStyle = "display:block; font-family:'Sora',sans-serif; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px;";

  }).join('');

  return `
  <div class="fade-in">
    ${renderTopBar('Hunger Risk Indicator', 'Predict a country\'s hunger risk from food inflation, drought severity, conflict intensity and undernourishment. Classified as Low, Moderate, High, Very High or Extreme risk.')}

        </div>

        <form onsubmit="event.preventDefault(); calculateHungerRisk();">

function calculateHungerRisk() {
  const country = (document.getElementById('risk-country').value || '').trim() || 'Selected Country';
  let inflation = parseFloat(document.getElementById('risk-inflation').value) || 0;
  let drought = parseFloat(document.getElementById('risk-drought').value) || 1;
  let conflict = parseFloat(document.getElementById('risk-conflict').value) || 1;
  let undernourishment = parseFloat(document.getElementById('risk-undernourishment').value) || 0;

  inflation = Math.max(0, inflation);
  drought = Math.min(10, Math.max(1, drought));
  conflict = Math.min(5, Math.max(1, conflict));
  undernourishment = Math.min(100, Math.max(0, undernourishment));

  // Normalize each factor to its maximum contribution.
  const inflationPoints = Math.min(inflation / 20, 1) * 25;
  const droughtPoints = ((drought - 1) / 9) * 20;
  const conflictPoints = ((conflict - 1) / 4) * 15;
  const undernourishmentPoints = Math.min(undernourishment / 20, 1) * 40;

  // Final score is always constrained to 0–100.
  const score = Math.min(
    100,
    Math.max(0, inflationPoints + droughtPoints + conflictPoints + undernourishmentPoints)
  );

  let level;
  if (score < 20) level = RISK_LEVELS.low;
  else if (score < 40) level = RISK_LEVELS.moderate;
  else if (score < 60) level = RISK_LEVELS.high;
  else if (score < 80) level = RISK_LEVELS.veryHigh;
  else level = RISK_LEVELS.extreme;

  const meterWidth = Math.min(100, score);

  const breakdown = [
    { factor: 'Food Inflation',     weight: 'max 25 pts', points: inflationPoints,       icon: '📈' },
    { factor: 'Drought Severity',   weight: 'max 20 pts', points: droughtPoints,         icon: '☀️' },
    { factor: 'Conflict Intensity', weight: 'max 15 pts', points: conflictPoints,        icon: '⚔️' },
    { factor: 'Undernourishment',   weight: 'max 40 pts', points: undernourishmentPoints, icon: '🍽️' }
  ];

  document.getElementById('risk-result').innerHTML = `
    <div style="text-align:center; padding: 18px 14px; border-radius: 12px; background: ${level.glow}; border: 1px solid ${level.bar};">
      <div style="font-size: 30px; line-height: 1;">${level.emoji}</div>
      <div style="font-family:'Sora',sans-serif; font-size: 15px; font-weight: 700; color: ${level.text}; margin-top: 8px; letter-spacing: 0.04em;">${escapeHtml(country).toUpperCase()}</div>
      <div style="font-family:'Sora',sans-serif; font-size: 20px; font-weight: 800; color: ${level.text}; margin-top: 6px;">${level.label}</div>
      <div style="font-family:'Sora',sans-serif; font-size: 34px; font-weight: 800; color: ${level.text}; margin-top: 8px;">${score.toFixed(1)}<span style="font-size:16px; font-weight:600;"> / 100</span></div>
      <div style="height:10px; background:var(--bg-tertiary); border-radius:999px; overflow:hidden; margin-top:14px;">
        <div style="height:100%; width:${meterWidth}%; background:${level.bar}; border-radius:999px; transition:width .4s ease;"></div>
      </div>
    </div>

    <div style="margin-top:16px;">
      ${breakdown.map(item => `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);">
          <div>
            <div style="font-size:13px; font-weight:600;">${item.icon} ${item.factor}</div>
            <div style="font-size:11px; color:var(--text-subtle);">${item.weight}</div>
          </div>
          <div style="font-family:'Sora',sans-serif; font-size:14px; font-weight:700;">${item.points.toFixed(2)} pts</div>
        </div>
      `).join('')}
    </div>
  `;
}

function fillRiskPreset(name) {
  const p = RISK_PRESETS[name];
  if (!p) return;
  document.getElementById('risk-country').value = name;
  document.getElementById('risk-inflation').value = p.inflation;
  document.getElementById('risk-drought').value = p.drought;
  document.getElementById('risk-conflict').value = p.conflict;
  document.getElementById('risk-undernourishment').value = p.undernourishment;
  calculateHungerRisk();
}

  const slotConfigs = state.comparisonSlots.map((name, i) => {
    const country = findCountry(name);
    const isDuplicate = name && state.comparisonSlots.filter(s => s && s.toLowerCase() === name.toLowerCase()).length > 1;
    return { name, country, isDuplicate, index: i };
  });
  return `
    ${renderTopBar('Global Country Comparison', 'Compare up to four countries across population, hunger, food security, and food-system indicators. Charts update dynamically.')}
    <div class="fade-in">
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 32px;" id="country-slots">
        ${slotConfigs.map((slot, i) => renderCountrySlot(slot, i)).join('\n')}
      </div>
      ${slotConfigs.some(s => s.isDuplicate) ? `<div class="warning-note" style="margin-bottom: 20px;">Notice: A country is selected in more than one slot. Comparison is still allowed, but consider choosing a different country for richer insights.</div>` : ''}
      ${renderComparisonTable(slotConfigs)}
      <div class="section-divider"><h3>Dynamic Comparison Charts</h3></div>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Bars use the midpoint of any range for height. The original supplied value (with ≈, &lt;, or range) is shown as a data label above each bar and in the tooltip.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px;" id="charts-grid">
        ${renderChartCard('undernourishment-chart', 'Undernourishment %')}
        ${renderChartCard('hunger-chart', 'People Affected by Hunger')}
        ${renderChartCard('modsev-chart', 'Moderate + Severe Food Insecurity')}
        ${renderChartCard('sev-chart', 'Severe Food Insecurity')}
        ${renderChartCard('produced-chart', 'Food Produced')}
        ${renderChartCard('lost-chart', 'Food Lost')}
        ${renderChartCard('wasted-chart', 'Food Wasted')}
        ${renderChartCard('surplus-chart', 'Food Surplus')}
        ${renderChartCard('needing-chart', 'People Needing Food')}
      </div>
    </div>`;
}

function renderCountrySlot(slot, i) {
  const { name, country, isDuplicate } = slot;
  const inputVal = state.comparisonInput[i] !== '' ? state.comparisonInput[i] : (country ? country.name : '');
  const showAutocomplete = state.autocompleteOpen[i] && inputVal.length > 0;
  const matches = inputVal.length > 0 ? COUNTRIES.filter(c => c.name.toLowerCase().includes(inputVal.toLowerCase())).slice(0, 6) : [];
  return `
    <div class="country-slot ${country ? 'filled' : ''} ${isDuplicate ? 'duplicate' : ''}">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.08em;">SLOT ${i + 1}</span>
        ${country ? `<span class="pill ${isDuplicate ? 'pill-amber' : 'pill-green'}">SELECTED</span>` : `<span class="pill pill-neutral">EMPTY</span>`}
      </div>
      <div style="position: relative;">
        <input type="text" class="input country-search-input" data-slot="${i}" placeholder="Type a country..." value="${escapeHtml(inputVal)}" autocomplete="off" />
        ${showAutocomplete ? `<div class="autocomplete-list">${matches.length > 0 ? matches.map(c => `<div class="autocomplete-item" data-country="${escapeHtml(c.name)}" data-slot="${i}"><span class="flag">${c.flag}</span><span>${escapeHtml(c.name)}</span></div>`).join('') : `<div style="padding: 12px 14px; color: var(--text-muted); font-size: 13px;">No matches in dataset.</div>`}</div>` : ''}
      </div>
      ${country ? `<div style="margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);"><div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;"><span style="font-size: 28px; line-height: 1;">${country.flag}</span><div><div style="font-weight: 700; font-size: 15px; font-family: 'Sora', sans-serif;">${escapeHtml(country.name)}</div><div style="font-size: 11px; color: var(--text-muted);">Code: ${country.code}</div></div></div><div style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">Pop: ${escapeHtml(country.population)} (${country.populationYear})</div><button class="btn-secondary" data-country-detail="${escapeHtml(country.name)}" style="margin-top: 10px; width: 100%; padding: 8px 12px; font-size: 12px; justify-content: center;">View Detail</button></div>` : name ? `<div style="margin-top: 12px; padding: 12px; background: rgba(216, 90, 58, 0.08); border-radius: 8px; font-size: 12px; color: var(--warning);">Country data not available in current dataset.</div>` : ''}
    </div>`;
}

function renderChartCard(id, title) {
  return `<div class="card" style="padding: 18px;"><div style="font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; font-family: 'Sora', sans-serif;">${title}</div><div class="chart-container"><canvas id="${id}"></canvas></div></div>`;
}

function renderComparisonTable(slots) {
  const hasAny = slots.some(s => s.country);
  if (!hasAny) return `<div class="card" style="padding: 40px; text-align: center; color: var(--text-muted);"><div style="font-size: 36px; margin-bottom: 12px;">🌍</div><div style="font-weight: 600; color: var(--text); margin-bottom: 6px;">No countries selected</div><div style="font-size: 13px;">Type country names in the slots above to begin comparison.</div></div>`;
  const countrySlots = slots.map(s => s.country);
  const renderCell = (value) => !value ? `<span style="color: var(--text-subtle); font-style: italic; font-size: 12px;">Data not available</span>` : `<span style="font-weight: 500;">${escapeHtml(value)}</span>`;
  const rows = [
    { section: 'GENERAL' },
    { label: 'Country', values: countrySlots.map(c => c ? `${c.flag} ${c.name}` : null) },
    { label: 'Total Population', values: countrySlots.map(c => c ? c.population : null) },
    { label: 'Population year', values: countrySlots.map(c => c ? c.populationYear : null) },
    { section: 'HUNGER / FOOD SECURITY' },
    { label: 'Undernourishment %', values: countrySlots.map(c => c ? c.undernourishment : null), tooltip: 'undernourishment' },
    { label: 'People affected by hunger', values: countrySlots.map(c => c ? c.peopleAffectedByHunger : null), tooltip: 'undernourishment' },
    { label: 'Moderate + Severe Food Insecurity', values: countrySlots.map(c => c ? c.moderateSevereFoodInsecurity : null), tooltip: 'foodInsecurity' },
    { label: 'Severe Food Insecurity', values: countrySlots.map(c => c ? c.severeFoodInsecurity : null), tooltip: 'severeFoodInsecurity' },
    { label: 'GHI 2025', values: countrySlots.map(c => c ? c.ghi2025 : null), tooltip: 'ghi' },
    { section: 'FOOD SYSTEM' },
    { label: 'Food Produced', values: countrySlots.map(c => c ? c.foodProduced : null) },
    { label: 'Food Lost', values: countrySlots.map(c => c ? c.foodLost : null), tooltip: 'foodLoss' },
    { label: 'Food Wasted', values: countrySlots.map(c => c ? c.foodWasted : null), tooltip: 'foodWaste' },
    { label: 'Food Surplus', values: countrySlots.map(c => c ? c.foodSurplus : null), tooltip: 'foodSurplus' },
    { label: 'People Needing Food', values: countrySlots.map(c => c ? c.peopleNeedingFood : null), tooltip: 'peopleNeedingFood' }
  ];
  return `
    <div class="section-divider"><h3>Comparison Table</h3></div>
    <div class="card" style="padding: 0; overflow: hidden;">
      <div class="table-scroll" style="overflow-x: auto;">
        <table class="comparison-table">
          <thead><tr><th class="indicator-label">Indicator</th>${countrySlots.map((c, i) => c ? `<th style="min-width: 180px;"><div style="display: flex; align-items: center; gap: 8px;"><span class="flag">${c.flag}</span><span>${escapeHtml(c.name)}</span></div></th>` : `<th style="min-width: 180px;"><span style="color: var(--text-subtle);">Slot ${i+1}</span></th>`).join('')}</tr></thead>
          <tbody>${rows.map(r => r.section ? `<tr class="section-row"><td colspan="${countrySlots.length + 1}">${r.section}</td></tr>` : `<tr><td class="indicator-label">${escapeHtml(r.label)}${r.tooltip ? `<span class="tooltip"><span class="info-icon">i</span><span class="tooltip-text">${TOOLTIPS[r.tooltip]}</span></span>` : ''}</td>${r.values.map(v => `<td class="col-data">${renderCell(v)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

function initComparisonCharts() {
  const countries = state.comparisonSlots.map(n => findCountry(n)).filter(c => c);
  if (countries.length === 0) return;
  const isDark = state.theme === 'dark';
  const palette = ['#6BB85B', '#E8A53A', '#4A7C3A', '#D85A3A'];
  const charts = [
    ['undernourishment-chart', 'undernourishment'],
    ['hunger-chart', 'peopleAffectedByHunger'],
    ['modsev-chart', 'moderateSevereFoodInsecurity'],
    ['sev-chart', 'severeFoodInsecurity'],
    ['produced-chart', 'foodProduced'],
    ['lost-chart', 'foodLost'],
    ['wasted-chart', 'foodWasted'],
    ['surplus-chart', 'foodSurplus'],
    ['needing-chart', 'peopleNeedingFood']
  ];
  charts.forEach(([id, field]) => {
    const c = makeBarChart(id, countries, field, isDark, palette);
    if (c) activeCharts.push(c);
  });
}

/* =========================================================
   COUNTRY DETAIL PAGE
   ========================================================= */
function renderCountryDetail() {
  const country = state.currentCountryDetail ? findCountry(state.currentCountryDetail) : null;
  if (!country) return `${renderTopBar('Country Detail', '')}<div class="card" style="padding: 40px; text-align: center; color: var(--text-muted);"><div style="font-size: 36px; margin-bottom: 12px;">🔍</div>Country data not available in current dataset.<div style="margin-top: 16px;"><button class="btn-primary" data-view="comparison">Back to Comparison</button></div></div>`;
  const renderStat = (label, value, tooltipKey) => `<div class="country-detail-stat"><div style="font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px;">${escapeHtml(label)}${tooltipKey ? `<span class="tooltip"><span class="info-icon">i</span><span class="tooltip-text">${TOOLTIPS[tooltipKey]}</span></span>` : ''}</div><div style="font-size: 18px; font-weight: 700; color: var(--text); font-family: 'Sora', sans-serif;">${escapeHtml(value)}</div></div>`;
  return `
    ${renderTopBar(`${country.flag} ${country.name}`, `Country code: ${country.code} · Population year: ${country.populationYear}`)}
    <div class="fade-in">
      <button class="btn-secondary" data-view="comparison" style="margin-bottom: 20px; padding: 8px 14px; font-size: 13px;">← Back to Comparison</button>
      <div class="section-divider"><h3>Food Security Overview</h3></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 32px;">${renderStat('Total Population', country.population)}${renderStat('Population Year', country.populationYear)}${renderStat('GHI 2025', country.ghi2025, 'ghi')}</div>
      <div class="section-divider"><h3>Hunger & Food Security</h3></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 32px;">${renderStat('Undernourishment', country.undernourishment, 'undernourishment')}${renderStat('People Affected by Hunger', country.peopleAffectedByHunger, 'undernourishment')}${renderStat('Moderate + Severe Food Insecurity', country.moderateSevereFoodInsecurity, 'foodInsecurity')}${renderStat('Severe Food Insecurity', country.severeFoodInsecurity, 'severeFoodInsecurity')}</div>
      <div class="section-divider"><h3>Food Production</h3></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 32px;">${renderStat('Food Produced', country.foodProduced)}</div>
      <div class="section-divider"><h3>Food Loss & Waste</h3></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 32px;">${renderStat('Food Lost', country.foodLost, 'foodLoss')}${renderStat('Food Wasted', country.foodWasted, 'foodWaste')}</div>
      <div class="section-divider"><h3>Food Surplus & People in Need</h3></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 32px;">${renderStat('Food Surplus', country.foodSurplus, 'foodSurplus')}${renderStat('People Needing Food', country.peopleNeedingFood, 'peopleNeedingFood')}</div>
      <div class="section-divider"><h3>Country Food Flow</h3></div>
      <div class="card" style="padding: 28px;">${renderCountryFlow(country)}</div>
      <div class="section-divider"><h3>Hunger Risk Indicator Profile</h3></div>
      <div class="card" style="padding: 20px;"><p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">This is an <strong style="color: var(--text);">indicator-based hunger risk profile</strong>. No composite risk score is computed because no mathematical formula is supplied in the current dataset.</p>${renderHungerRiskProfile(country)}</div>
    </div>`;
}

function renderCountryFlow(country) {
  const steps = [{label:'Food Produced',value:country.foodProduced,color:'#6BB85B'},{label:'Food Lost',value:country.foodLost,color:'#E8A53A'},{label:'Food Wasted',value:country.foodWasted,color:'#D85A3A'},{label:'Food Surplus',value:country.foodSurplus,color:'#4A7C3A'},{label:'People Needing Food',value:country.peopleNeedingFood,color:'#2D5F3F'}];
  return `<div style="display: flex; flex-direction: column; align-items: center; gap: 0;">${steps.map((s, i) => `<div class="flow-step accent" style="width: 100%; max-width: 460px; border-left-color: ${s.color};"><div style="font-size: 11px; font-weight: 700; color: ${s.color}; letter-spacing: 0.08em; text-transform: uppercase;">${s.label}</div><div style="font-size: 17px; font-weight: 700; margin-top: 4px; font-family: 'Sora', sans-serif;">${escapeHtml(s.value)}</div></div>${i < steps.length - 1 ? `<div class="food-flow-connector"></div>` : ''}`).join('')}</div>`;
}

function renderHungerRiskProfile(country) {
  const indicators = [{label:'Undernourishment',value:country.undernourishment},{label:'Moderate + Severe Food Insecurity',value:country.moderateSevereFoodInsecurity},{label:'Severe Food Insecurity',value:country.severeFoodInsecurity},{label:'People Affected by Hunger',value:country.peopleAffectedByHunger},{label:'Food Production',value:country.foodProduced},{label:'Food Loss',value:country.foodLost},{label:'Food Waste',value:country.foodWasted},{label:'Food Surplus',value:country.foodSurplus},{label:'People Needing Food',value:country.peopleNeedingFood}];
  return `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">${indicators.map(ind => `<div style="padding: 14px; background: var(--bg-secondary); border-radius: 10px; border-left: 3px solid var(--primary-bright);"><div style="font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;">${escapeHtml(ind.label)}</div><div style="font-size: 15px; font-weight: 600; color: var(--text); margin-top: 4px; font-family: 'Sora', sans-serif;">${escapeHtml(ind.value)}</div></div>`).join('')}</div>`;
}

/* =========================================================
   CROP INTELLIGENCE PAGE
   ========================================================= */
function renderCropIntelligence() {
  const stateSearch = state.stateSearch;
  const filters = state.cropFilters;
  let results = []; let mode = 'none';
  if (stateSearch.trim()) {
    const norm = normalizeText(stateSearch);
    const matchedStates = getUniqueStates().filter(s => s.toLowerCase().includes(norm));
    if (matchedStates.length > 0) { results = CROPS.filter(c => c.states && c.states.split(',').some(s => s.trim().toLowerCase() === matchedStates[0].toLowerCase())); mode = 'state'; }
    else mode = 'state-not-found';
  } else if (filters.state || filters.season || filters.type || filters.water) { results = filterCrops(filters); mode = 'filter'; }
  return `
    ${renderTopBar('India Crop Intelligence', 'Search any Indian state to see associated crops, or use the filter panel below. Each crop card opens complete growing and nutrition intelligence.')}
    <div class="fade-in">
      <div class="card" style="padding: 24px; margin-bottom: 24px;">
        <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; display: block; margin-bottom: 10px;">Search by Indian State</label>
        <div style="position: relative; max-width: 560px;">
          <input type="text" id="state-search" class="input" placeholder="Type Indian state name..." value="${escapeHtml(stateSearch)}" autocomplete="off" style="padding-left: 38px;" />
          <div style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-subtle);">${ICONS.search}</div>
          <div id="state-autocomplete" class="autocomplete-list" style="display: none;"></div>
        </div>
        <div style="margin-top: 12px; font-size: 12px; color: var(--text-muted);">Examples: Andhra Pradesh, Tamil Nadu, Kerala, Punjab, Maharashtra, Assam, West Bengal</div>
      </div>
      <div class="card" style="padding: 20px; margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
          <div style="font-size: 13px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase;">Advanced Filters</div>
          <button id="reset-filters" class="btn-secondary" style="padding: 6px 12px; font-size: 12px;">Reset</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;">
          <div><label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 6px;">State</label><select class="input filter-select" data-filter="state" style="padding: 9px 12px;"><option value="">All states</option>${getUniqueStates().map(s => `<option value="${escapeHtml(s)}" ${filters.state === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select></div>
          <div><label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 6px;">Season</label><select class="input filter-select" data-filter="season" style="padding: 9px 12px;"><option value="">All seasons</option>${['Kharif','Rabi','Perennial','Annual','Summer'].map(s => `<option value="${s}" ${filters.season === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
          <div><label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 6px;">Crop Type</label><select class="input filter-select" data-filter="type" style="padding: 9px 12px;"><option value="">All crops</option><option value="food" ${filters.type === 'food' ? 'selected' : ''}>Food crop</option><option value="non-food" ${filters.type === 'non-food' ? 'selected' : ''}>Non-food crop</option></select></div>
          <div><label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 6px;">Water Requirement</label><select class="input filter-select" data-filter="water" style="padding: 9px 12px;"><option value="">Any</option><option value="low" ${filters.water === 'low' ? 'selected' : ''}>Low (&lt;600 mm)</option><option value="medium" ${filters.water === 'medium' ? 'selected' : ''}>Medium (600–900 mm)</option><option value="high" ${filters.water === 'high' ? 'selected' : ''}>High (&gt;900 mm)</option></select></div>
        </div>
      </div>
      ${mode === 'state' ? `<div class="section-divider"><h3>Crops associated with ${escapeHtml(stateSearch)}</h3></div>${results.length > 0 ? `<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;">${results.map(c => renderCropCard(c)).join('')}</div>` : `<div class="card" style="padding: 32px; text-align: center; color: var(--text-muted);">No crops found for this state in the current dataset.</div>`}` : mode === 'state-not-found' ? `<div class="card" style="padding: 32px; text-align: center;"><div style="font-size: 32px; margin-bottom: 10px;">🌾</div><div style="font-weight: 600; color: var(--warning); margin-bottom: 4px;">No crop intelligence data available for this state in the current dataset.</div><div style="font-size: 13px; color: var(--text-muted);">Try a different state name or use the filters above.</div></div>` : mode === 'filter' ? `<div class="section-divider"><h3>Filtered Crops (${results.length})</h3></div><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;">${results.map(c => renderCropCard(c)).join('')}</div>` : `<div class="section-divider"><h3>All Crops in Dataset (${CROPS.length})</h3></div><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;">${CROPS.map(c => renderCropCard(c)).join('')}</div>`}
    </div>`;
}

function renderCropCard(crop) {
  const icon = crop.type === 'food' ? '🌾' : '🌱';
  return `<div class="crop-card" data-crop-detail="${escapeHtml(crop.name)}"><div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px;"><div style="display: flex; align-items: center; gap: 10px;"><span style="font-size: 22px;">${icon}</span><div><div style="font-weight: 700; font-size: 15px; font-family: 'Sora', sans-serif;">${escapeHtml(crop.name)}</div><div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${escapeHtml(crop.season)}</div></div></div><span class="pill ${crop.type === 'food' ? 'pill-green' : 'pill-amber'}">${crop.type === 'food' ? 'FOOD' : 'NON-FOOD'}</span></div><div style="font-size: 12px; color: var(--text-muted); line-height: 1.55;"><div style="margin-bottom: 4px;"><strong style="color: var(--text);">Soil:</strong> ${escapeHtml(crop.soil)}</div><div style="margin-bottom: 4px;"><strong style="color: var(--text);">Temp:</strong> ${escapeHtml(crop.temperature)}</div><div><strong style="color: var(--text);">Water:</strong> ${escapeHtml(crop.water)}</div></div><div style="margin-top: 12px; font-size: 12px; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 6px;">View full intelligence ${ICONS.arrowRight}</div></div>`;
}

/* =========================================================
   CROP DETAIL PAGE
   ========================================================= */
function renderCropDetail() {

  if (!crop) return `${renderTopBar('Crop Intelligence', '')}<div class="card" style="padding: 40px; text-align: center; color: var(--text-muted);">Crop data not available in current dataset.<div style="margin-top: 16px;"><button class="btn-primary" data-view="crop-intelligence">Back to Crop Search</button></div></div>`;
  const icon = crop.type === 'food' ? '🌾' : '🌱';
  const renderField = (label, value) => !value ? '' : `<div style="padding: 14px 16px; background: var(--bg-secondary); border-radius: 10px; border-left: 3px solid var(--primary-bright);"><div style="font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px;">${escapeHtml(label)}</div><div style="font-size: 14px; color: var(--text); line-height: 1.55;">${escapeHtml(value)}</div></div>`;
  return `
    ${renderTopBar(`${icon} ${crop.name}`, 'Crop intelligence profile from the supplied India crop dataset.')}
    <div class="fade-in">
      <button class="btn-secondary" data-view="crop-intelligence" style="margin-bottom: 20px; padding: 8px 14px; font-size: 13px;">← Back to Crop Search</button>
      <div style="display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;"><span class="pill ${crop.type === 'food' ? 'pill-green' : 'pill-amber'}">${crop.type === 'food' ? 'FOOD CROP' : 'NON-FOOD CROP'}</span><span class="pill pill-neutral">${escapeHtml(crop.season)}</span></div>

function renderSurplusFlow(countryName) {
  const country = findCountry(countryName);
  if (!country) return `<div class="card" style="padding: 24px;">Country data not available in current dataset.</div>`;
  const steps = [{label:'FOOD PRODUCTION',value:country.foodProduced,color:'#6BB85B',desc:'Total food produced annually'},{label:'FOOD LOSS',value:country.foodLost,color:'#E8A53A',desc:'Lost along supply chain before retail'},{label:'FOOD WASTE',value:country.foodWasted,color:'#D85A3A',desc:'Discarded at retail/household level'},{label:'USABLE SURPLUS',value:country.foodSurplus,color:'#4A7C3A',desc:'Potential redistribution surplus'},{label:'STORAGE',value:'Refer to Storage Guide',color:'#88D977',desc:'Storage tier guidance applies'},{label:'REDISTRIBUTION',value:'Channel to people in need',color:'#88D977',desc:'Logistics & policy dependent'},{label:'PEOPLE NEEDING FOOD',value:country.peopleNeedingFood,color:'#2D5F3F',desc:'Population requiring food access'}];
  return `<div class="card" style="padding: 28px; margin-bottom: 24px;"><div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;"><span style="font-size: 32px;">${country.flag}</span><div><div style="font-weight: 700; font-size: 18px; font-family: 'Sora', sans-serif;">${escapeHtml(country.name)} — Food Flow</div><div style="font-size: 12px; color: var(--text-muted);">Production → Loss → Waste → Surplus → Redistribution → People in Need</div></div></div><div style="display: flex; flex-direction: column; align-items: center; gap: 0;">${steps.map((s, i) => `<div class="flow-step accent" style="width: 100%; max-width: 520px; border-left-color: ${s.color};"><div style="font-size: 11px; font-weight: 700; color: ${s.color}; letter-spacing: 0.08em;">${s.label}</div><div style="font-size: 17px; font-weight: 700; margin-top: 4px; font-family: 'Sora', sans-serif;">${escapeHtml(s.value)}</div><div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">${escapeHtml(s.desc)}</div></div>${i < steps.length - 1 ? `<div class="food-flow-connector"></div>` : ''}`).join('')}</div></div>`;
}

/* =========================================================
   EVENT LISTENERS
   ========================================================= */
function attachGlobalListeners() {
  document.getElementById('theme-toggle')?.addEventListener('click', () => { state.theme = state.theme === 'light' ? 'dark' : 'light'; localStorage.setItem('sdg2-theme', state.theme); render(); });
  document.getElementById('mobile-menu-toggle')?.addEventListener('click', () => { const menu = document.getElementById('mobile-menu'); menu.style.display = menu.style.display === 'none' ? 'block' : 'none'; });
  document.querySelectorAll('[data-view]').forEach(el => { el.addEventListener('click', (e) => { e.preventDefault(); navigate(el.getAttribute('data-view')); }); });

  document.querySelectorAll('.country-search-input').forEach(input => {
    input.addEventListener('input', (e) => {
      const slotIdx = parseInt(input.getAttribute('data-slot'));
      state.comparisonInput[slotIdx] = e.target.value;
      state.autocompleteOpen[slotIdx] = true;
      const slotsContainer = document.getElementById('country-slots');
      if (slotsContainer) {
        const slots = state.comparisonSlots.map((name, i) => { const country = findCountry(name); const isDuplicate = name && state.comparisonSlots.filter(s => s && s.toLowerCase() === name.toLowerCase()).length > 1; return { name, country, isDuplicate, index: i }; });
        slotsContainer.innerHTML = slots.map((s, i) => renderCountrySlot(s, i)).join('\n');
        attachGlobalListeners();
      }
    });
    input.addEventListener('focus', (e) => {
      const slotIdx = parseInt(input.getAttribute('data-slot'));
      state.autocompleteOpen[slotIdx] = true;
      if (e.target.value.length > 0) {
        const slotsContainer = document.getElementById('country-slots');
        if (slotsContainer) {
          const slots = state.comparisonSlots.map((name, i) => { const country = findCountry(name); const isDuplicate = name && state.comparisonSlots.filter(s => s && s.toLowerCase() === name.toLowerCase()).length > 1; return { name, country, isDuplicate, index: i }; });
          slotsContainer.innerHTML = slots.map((s, i) => renderCountrySlot(s, i)).join('\n');
          attachGlobalListeners();
          const newInput = document.querySelector(`.country-search-input[data-slot="${slotIdx}"]`);
          if (newInput) { newInput.focus(); newInput.setSelectionRange(newInput.value.length, newInput.value.length); }
        }
      }
    });
    input.addEventListener('blur', (e) => {
      const slotIdx = parseInt(input.getAttribute('data-slot'));
      setTimeout(() => {
        state.autocompleteOpen[slotIdx] = false;
        const val = e.target.value.trim();
        if (val === '') { state.comparisonSlots[slotIdx] = ''; state.comparisonInput[slotIdx] = ''; }
        else { const country = findCountry(val); if (country) { state.comparisonSlots[slotIdx] = country.name; state.comparisonInput[slotIdx] = ''; } else { state.comparisonSlots[slotIdx] = val; state.comparisonInput[slotIdx] = ''; } }
        render();
      }, 150);
    });
  });

  document.querySelectorAll('.autocomplete-item').forEach(item => {
    item.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const country = item.getAttribute('data-country');
      const slotIdx = parseInt(item.getAttribute('data-slot'));
      state.comparisonSlots[slotIdx] = country;
      state.comparisonInput[slotIdx] = '';
      state.autocompleteOpen[slotIdx] = false;
      render();
    });
  });

  document.querySelectorAll('[data-country-detail]').forEach(el => { el.addEventListener('click', (e) => { e.stopPropagation(); state.currentCountryDetail = el.getAttribute('data-country-detail'); navigate('country-detail'); }); });
  document.querySelectorAll('[data-crop-detail]').forEach(el => { el.addEventListener('click', () => { state.currentCropDetail = el.getAttribute('data-crop-detail'); navigate('crop-detail'); }); });

  const stateSearch = document.getElementById('state-search');
  if (stateSearch) {
    stateSearch.addEventListener('input', (e) => {
      state.stateSearch = e.target.value;
      const autocomplete = document.getElementById('state-autocomplete');
      if (e.target.value.length > 0) {
        const matches = getUniqueStates().filter(s => s.toLowerCase().includes(e.target.value.toLowerCase())).slice(0, 8);
        if (matches.length > 0) {
          autocomplete.style.display = 'block';
          autocomplete.innerHTML = matches.map(s => `<div class="autocomplete-item" data-state="${escapeHtml(s)}">${escapeHtml(s)}</div>`).join('');
          autocomplete.querySelectorAll('.autocomplete-item').forEach(item => { item.addEventListener('mousedown', (ev) => { ev.preventDefault(); state.stateSearch = item.getAttribute('data-state'); render(); }); });
        } else autocomplete.style.display = 'none';
      } else autocomplete.style.display = 'none';
    });
    stateSearch.addEventListener('blur', () => { setTimeout(() => { const a = document.getElementById('state-autocomplete'); if (a) a.style.display = 'none'; }, 150); });
    stateSearch.addEventListener('keydown', (e) => { if (e.key === 'Enter') { state.stateSearch = e.target.value.trim(); render(); } });
  }

  document.querySelectorAll('.filter-select').forEach(sel => { sel.addEventListener('change', (e) => { state.cropFilters[e.target.getAttribute('data-filter')] = e.target.value; render(); }); });
  document.getElementById('reset-filters')?.addEventListener('click', () => { state.cropFilters = { state: '', season: '', type: '', water: '' }; state.stateSearch = ''; render(); });

  const storageSelect = document.getElementById('storage-crop-select');
  if (storageSelect) {
    storageSelect.addEventListener('change', (e) => {
      const cropName = e.target.value;
      const info = document.getElementById('crop-storage-info');
      if (!cropName) { info.innerHTML = ''; return; }
      const crop = CROPS.find(c => c.name === cropName);
      if (!crop) { info.innerHTML = `<div class="card" style="padding: 20px;">Crop not found in dataset.</div>`; return; }
      info.innerHTML = `<div class="card" style="padding: 22px; margin-top: 16px;"><div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;"><span style="font-size: 28px;">${crop.type === 'food' ? '🌾' : '🌱'}</span><div><div style="font-weight: 700; font-size: 16px; font-family: 'Sora', sans-serif;">${escapeHtml(crop.name)}</div><div style="font-size: 12px; color: var(--text-muted);">Season: ${escapeHtml(crop.season)}</div></div></div><div class="methodology-note" style="margin-bottom: 16px;">Crop-specific storage guidance is not separately supplied in the project dataset for <strong>${escapeHtml(crop.name)}</strong>. The general storage factors below apply.</div><div style="overflow-x: auto;"><table class="comparison-table" style="font-size: 13px;"><thead><tr><th class="indicator-label">Storage Factor</th><th>🏠 Households</th><th>🍽️ Hotels / Restaurants</th><th>📦 Supply Vendors</th></tr></thead><tbody>${STORAGE.map(row => `<tr><td class="indicator-label">${escapeHtml(row.factor)}</td><td class="col-data">${escapeHtml(row.household)}</td><td class="col-data">${escapeHtml(row.hotelRestaurant)}</td><td class="col-data">${escapeHtml(row.supplyVendor)}</td></tr>`).join('')}</tbody></table></div><div style="margin-top: 16px; padding: 14px; background: var(--bg-secondary); border-radius: 10px; font-size: 12px; color: var(--text-muted);"><strong style="color: var(--text);">Crop growing notes:</strong> ${escapeHtml(crop.soil || 'N/A')} soil · ${escapeHtml(crop.temperature || 'N/A')} · Water: ${escapeHtml(crop.water || 'N/A')}</div></div>`;
    });
  }

  const surplusSelect = document.getElementById('surplus-country-select');
  if (surplusSelect) {
    surplusSelect.addEventListener('change', (e) => { state.currentCountryDetail = e.target.value; const flowContainer = document.getElementById('surplus-flow-container'); if (flowContainer) flowContainer.innerHTML = renderSurplusFlow(e.target.value); });
    if (!state.currentCountryDetail) state.currentCountryDetail = 'India';
    surplusSelect.value = state.currentCountryDetail;
  }
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  if (!state.currentCountryDetail) state.currentCountryDetail = 'India';
  render();
}
init();
</script>
</body>
</html>
